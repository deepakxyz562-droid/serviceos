# CI — runs on every Pull Request and push to main.
#
# Pipeline stages (ALL BLOCKING as of Phase Security-1):
#   1. Lint (blocking — 0 errors required)
#   2. TypeScript check (blocking — must pass cleanly)
#   3. Build (blocking — ensures the app actually compiles)
#   4. Unit tests (blocking — vitest)
#   5. Mobile lint + typecheck (blocking — all three Expo apps)
#
# The pre-existing 11 lint errors were fixed in Phase Security-1
# (super-admin authorization + cron auth + set-state-in-effect refactors).
# CI is now a trustworthy quality gate — new errors cannot enter.
#
# To run locally:
#   bun run lint
#   npx tsc --noEmit
#   bun run build
#   bun run test:run

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: TypeScript check (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

  build:
    name: Build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build
        run: bun run build
        env:
          # Skip DB connection during build — Next.js only needs the client for types.
          DATABASE_URL: "file::memory:"
          JWT_SECRET: "ci-build-secret"

  test:
    name: Unit tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:run

  mobile-quality:
    name: Mobile quality (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-app, gptform-mobile-app, quote-flow-mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ "${{ matrix.app }}" = "mobile-app" ]; then
            bun install --frozen-lockfile
          else
            npm ci --legacy-peer-deps
          fi

      - name: Run lint
        run: npm run lint -- --quiet

      - name: Run TypeScript check
        run: npm run typecheck
