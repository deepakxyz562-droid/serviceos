# Cron Jobs — 3rd-Party Scheduler via GitHub Actions
#
# ⚠️  GitHub Actions free tier limits scheduled workflows to 5-min minimum
# interval and throttles aggressively. For production, prefer cron-job.org
# (see cron-configs/cron-job-org-import.json).
#
# REQUIRED REPO SECRETS:
#   - APP_URL     → your deployed app URL (e.g. https://yourapp.vercel.app)
#   - CRON_SECRET → must match the CRON_SECRET env var on your Next.js app
#
# All 12 jobs below use the same pattern: curl POST with x-cron-secret header.

name: Cron Jobs

on:
  workflow_dispatch: {}  # allow manual triggers

# Schedules are defined per-job below using the `schedule` event.
# Each job runs independently on its own cron.

jobs:
  # ─── Daily Jobs (8) ───────────────────────────────────────────────────────

  marketplace-settlement:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/marketplace-settlement" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1
  # schedule: 0 2 * * *  (uncomment below to enable — requires the job to have `on: schedule:`)

  trial-expire:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/trial-expire" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  trial-reminders:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/trial-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  renewal:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/renewal" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  pre-charge-reminder:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/pre-charge-reminder" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  recurring-invoices:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/recurring-invoices" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  recurring-jobs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/recurring-jobs" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  overdue-detector:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/overdue-detector" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  # ─── High-Frequency Jobs (4) ──────────────────────────────────────────────
  # ⚠️  GitHub Actions minimum interval is 5 min. These every-15-min jobs
  # will work, but may be throttled on free tier. Prefer cron-job.org.

  campaigns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/campaigns" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  scheduled-messages:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/scheduled-messages" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  scheduled-executions:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/scheduled-executions" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

  appointment-reminders:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/appointment-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || exit 1

# ─── HOW TO ENABLE SCHEDULES ────────────────────────────────────────────────
# GitHub Actions doesn't allow per-job schedules in a single workflow file.
# To enable schedules, create SEPARATE workflow files per cadence:
#
# .github/workflows/cron-daily.yml       → on: schedule: [{cron: "0 1 * * *"}]
# .github/workflows/cron-fifteen.yml     → on: schedule: [{cron: "*/15 * * * *"}]
# .github/workflows/cron-six-hourly.yml  → on: schedule: [{cron: "0 */6 * * *"}]
#
# This file serves as the job-template reference. Copy the relevant jobs into
# cadence-specific workflow files with the appropriate `on: schedule:` trigger.
