# Shopify App Configuration
# Generated by Shopify CLI — used for theme app extension deployment

name = "GPTForm Embed"
app_id = "gptform-embed"
application_url = "https://fieseros.com/gptform"
embedded = false

[build]
include_config_on_deploy = true

[auth]
redirect_urls = [
  "https://fieseros.com/auth/shopify/callback"
]

[app_preferences]
use_embedded_app = false

# ─── Theme App Extension ────────────────────────────────────────────────────
# This extension adds the GPTForm block to the Shopify theme editor,
# allowing merchants to drag-and-drop forms onto any page.

[[extensions]]
type = "theme"
name = "GPTForm Embed Block"
handle = "gptform-embed"

[[extensions.targets]]
target = "block"
module = "./blocks/gptform_form.liquid"

[[extensions.snippets]]
name = "gptform-embed"
file = "./snippets/gptform-embed.liquid"
