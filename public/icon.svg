<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00965e" />
      <stop offset="100%" stop-color="#0b8e5d" />
    </linearGradient>
  </defs>
  <!-- Squircle background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)" />
  <!-- White F mark: two parallel forward-leaning swooshes + dot -->
  <g fill="#ffffff">
    <!-- Upper swoosh (top bar) -->
    <path d="M130,165 L390,120 L405,155 L145,200 Z" />
    <!-- Lower swoosh (middle bar) -->
    <path d="M140,255 L360,215 L375,250 L155,290 Z" />
    <!-- Dot at bottom-left -->
    <circle cx="135" cy="375" r="26" />
  </g>
</svg>
